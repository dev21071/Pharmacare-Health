name: Build PharmaCare APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify TypeScript & code quality
        run: npm run lint

      - name: Build web application
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || '' }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK, accept licenses & install packages
        run: |
          if ! command -v sdkmanager &> /dev/null; then
            export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/13.0/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          fi

          mkdir -p "${ANDROID_HOME}/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_HOME}/licenses/android-sdk-license"
          echo -e "84831b9409646a2a8e388d752ff047cc08d2c1f9" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Verify Java version
        run: java -version

      - name: Verify Gradle version
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -version

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
