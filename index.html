<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary App Identification -->
    <title>PharmaCare — Smart Medicine Companion & Healthcare Network</title>
    <meta name="description" content="Smart medicine companion, dose alarms, prescription vault, doctor directory, and family caregiver link." />
    
    <!-- PWA & Android APK Web Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme & System Bar Styling -->
    <meta name="theme-color" content="#0F4C81" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PharmaCare" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Social Share & SEO -->
    <meta property="og:title" content="PharmaCare — Smart Medicine Companion & Healthcare Network" />
    <meta property="og:description" content="Smart medicine companion, dose alarms, prescription vault, doctor directory, and family caregiver link." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    
    <style>
      /* Android APK & Mobile Viewport Enhancements */
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
      }
      
      /* Safe area insets for notches & Android navigation gestures */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      
      /* Standalone App Mode Tweaks */
      @media all and (display-mode: standalone) {
        body {
          user-select: none;
          -webkit-user-select: none;
        }
        input, textarea, select {
          user-select: auto;
          -webkit-user-select: auto;
        }
      }
    </style>
  </head>
  <body class="bg-[#F5FAFF] text-[#0F172A] font-['Plus_Jakarta_Sans',system-ui,-apple-system,sans-serif] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
